name: publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish due posts
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          PAGE_ID: ${{ vars.PAGE_ID }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python publisher.py run
      - name: Save queue status
        if: always()
        run: |
          git config user.name "sila-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "Update publish status" && git push)
